x-flower-service: &flower-service
  image: federated-machine-learning:latest
  restart: unless-stopped

x-clientapp: &clientapp
  <<: *flower-service
  environment:
    CLIENT_DATA_DIR: /app/client-data
    FML_CODE_REVISION: "${FML_CODE_REVISION:-}"
    FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public

x-supernode: &supernode
  <<: *flower-service
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import socket;
        socket.create_connection(("127.0.0.1", 9094), timeout=2).close()
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  superlink:
    <<: *flower-service
    build: .
    command: >
      uv run --no-sync
      flower-superlink
      --insecure
      --isolation process
      --database /app/state/state.db
      --health-server-address 0.0.0.0:9099
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(("127.0.0.1", 9099), timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "127.0.0.1:9093:9093"
    volumes:
      - superlink-state:/app/state

  serverapp:
    <<: *flower-service
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type serverapp
      --appio-api-address superlink:9091
    environment:
      FML_CODE_REVISION: "${FML_CODE_REVISION:-}"
      FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public
      FML_SERVER_ARTIFACT_DIR: /app/artifacts/server
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - ./artifacts/public:/app/artifacts/public:ro
      - ./artifacts/server:/app/artifacts/server

  supernode-0:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=0
      --clientappio-api-address 0.0.0.0:9094
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-0:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-0:9094
    depends_on:
      supernode-0:
        condition: service_healthy
    volumes:
      - ./artifacts/public:/app/artifacts/public:ro
      - type: bind
        source: ./artifacts/clients/client-0
        target: /app/client-data
        read_only: true

  supernode-1:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=1
      --clientappio-api-address 0.0.0.0:9094
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-1:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-1:9094
    depends_on:
      supernode-1:
        condition: service_healthy
    volumes:
      - ./artifacts/public:/app/artifacts/public:ro
      - type: bind
        source: ./artifacts/clients/client-1
        target: /app/client-data
        read_only: true

  supernode-2:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=2
      --clientappio-api-address 0.0.0.0:9094
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-2:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-2:9094
    depends_on:
      supernode-2:
        condition: service_healthy
    volumes:
      - ./artifacts/public:/app/artifacts/public:ro
      - type: bind
        source: ./artifacts/clients/client-2
        target: /app/client-data
        read_only: true

  supernode-3:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=3
      --clientappio-api-address 0.0.0.0:9094
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-3:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-3:9094
    depends_on:
      supernode-3:
        condition: service_healthy
    volumes:
      - ./artifacts/public:/app/artifacts/public:ro
      - type: bind
        source: ./artifacts/clients/client-3
        target: /app/client-data
        read_only: true

  dashboard:
    <<: *flower-service
    command: >
      uv run --no-sync
      streamlit run dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
    environment:
      FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public
      FML_SERVER_ARTIFACT_DIR: /app/artifacts/server
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./artifacts/public:/app/artifacts/public:ro
      - ./artifacts/server:/app/artifacts/server:ro

volumes:
  superlink-state:
