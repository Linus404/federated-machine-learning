x-flower-service: &flower-service
  image: ${FML_IMAGE:-federated-machine-learning:latest}
  restart: unless-stopped
  labels:
    org.opencontainers.image.revision: "${FML_RELEASE:-development}"
    org.federated-ml.environment: "${FML_ENVIRONMENT:-development}"
  logging:
    driver: local
    options:
      max-size: "${FML_LOG_MAX_SIZE:-10m}"
      max-file: "${FML_LOG_MAX_FILES:-5}"
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  cpus: 2.0
  mem_limit: 4g
  pids_limit: 512
  tmpfs:
    - /tmp:size=512m,mode=1777
  env_file:
    - .env.protocol

x-superexec: &superexec
  <<: *flower-service
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import socket;
        socket.create_connection(("127.0.0.1", 9095), timeout=2).close()
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

x-clientapp: &clientapp
  <<: *superexec
  environment:
    CLIENT_DATA_DIR: /app/client-data
    FML_CODE_REVISION: "${FML_CODE_REVISION:-}"
    FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public

x-supernode: &supernode
  <<: *flower-service
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import socket;
        socket.create_connection(("127.0.0.1", 9095), timeout=2).close()
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  superlink:
    <<: *flower-service
    build: .
    command: >
      uv run --no-sync
      flower-superlink
      --insecure
      --isolation process
      --database /app/state/state.db
      --health-server-address 0.0.0.0:9099
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(("127.0.0.1", 9099), timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "${FML_CONTROL_BIND:-127.0.0.1:9093}:9093"
    volumes:
      - superlink-state:/app/state

  serverapp:
    <<: *superexec
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type serverapp
      --appio-api-address superlink:9091
      --health-server-address 0.0.0.0:9095
    environment:
      FML_CODE_REVISION: "${FML_CODE_REVISION:-}"
      FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public
      FML_SERVER_ARTIFACT_DIR: /app/artifacts/server
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/public:/app/artifacts/public:ro
      - server-artifacts:/app/artifacts

  supernode-0:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=0
      --clientappio-api-address 0.0.0.0:9094
      --health-server-address 0.0.0.0:9095
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-0:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-0:9094
      --health-server-address 0.0.0.0:9095
    depends_on:
      supernode-0:
        condition: service_healthy
    volumes:
      - ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/public:/app/artifacts/public:ro
      - type: bind
        source: ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/client/client-0
        target: /app/client-data
        read_only: true

  supernode-1:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=1
      --clientappio-api-address 0.0.0.0:9094
      --health-server-address 0.0.0.0:9095
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-1:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-1:9094
      --health-server-address 0.0.0.0:9095
    depends_on:
      supernode-1:
        condition: service_healthy
    volumes:
      - ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/public:/app/artifacts/public:ro
      - type: bind
        source: ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/client/client-1
        target: /app/client-data
        read_only: true

  supernode-2:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=2
      --clientappio-api-address 0.0.0.0:9094
      --health-server-address 0.0.0.0:9095
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-2:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-2:9094
      --health-server-address 0.0.0.0:9095
    depends_on:
      supernode-2:
        condition: service_healthy
    volumes:
      - ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/public:/app/artifacts/public:ro
      - type: bind
        source: ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/client/client-2
        target: /app/client-data
        read_only: true

  supernode-3:
    <<: *supernode
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink superlink:9092
      --node-config partition-id=3
      --clientappio-api-address 0.0.0.0:9094
      --health-server-address 0.0.0.0:9095
      --isolation process
    depends_on:
      superlink:
        condition: service_healthy

  clientapp-3:
    <<: *clientapp
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode-3:9094
      --health-server-address 0.0.0.0:9095
    depends_on:
      supernode-3:
        condition: service_healthy
    volumes:
      - ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/public:/app/artifacts/public:ro
      - type: bind
        source: ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/client/client-3
        target: /app/client-data
        read_only: true

  dashboard:
    <<: *flower-service
    command: >
      uv run --no-sync
      streamlit run dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.enableCORS=true
      --server.enableXsrfProtection=true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen("http://127.0.0.1:8501/_stcore/health", timeout=2).read()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    environment:
      FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public
      FML_SERVER_ARTIFACT_DIR: /app/artifacts/server
    ports:
      - "${FML_DASHBOARD_BIND:-127.0.0.1:8501}:8501"
    volumes:
      - ${FML_PREPARED_ARTIFACT_ROOT:-./artifacts/.prepared-current}/public:/app/artifacts/public:ro
      - server-artifacts:/app/artifacts:ro

volumes:
  server-artifacts:
  superlink-state:
