[project]
name = "federated-machine-learning"
version = "0.1.0"
description = "Federated sentiment analysis using Flower and Keras"
readme = "README.md"
authors = [
    { name = "LeLinus", email = "linus.code404@gmail.com" }
]
requires-python = ">=3.11, <3.14"
dependencies = [
    "datasets>=4.8.5",
    "flwr[simulation]>=1.29.0",
    "ipykernel>=7.2.0",
    "keras>=3.14.0",
    "nbformat>=5.10.4",
    "tensorflow>=2.13.0",
    "torch>=2.11.0",
]

[tool.uv]
package = false

[tool.flwr.app]
publisher = "Gruppe Sigmas"

[tool.flwr.app.components]
serverapp = "src.server_app:app"
clientapp = "src.client_app:app"

[tool.flwr.app.config]
num-server-rounds = 3

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.15.12",
]
