[framework]
tensorflow_version = "2.20.0"
keras_version = "3.14.0"
numpy_version = "2.4.4"
keras_backend = "tensorflow"
version_check = "Hard-fail before preprocessing, partitioning, or training unless tensorflow.__version__, keras.__version__, and numpy.__version__ exactly match the registered versions."
execution_environment_before_import = { KERAS_BACKEND = "tensorflow", TF_ENABLE_ONEDNN_OPTS = "0", TF_DETERMINISTIC_OPS = "1", PYTHONHASHSEED = "0" }
deterministic_ops_api = "tf.config.experimental.enable_op_determinism()"
seed_api = "keras.utils.set_random_seed(tensorflow_seed)"
seed_api_order = "Call keras.utils.set_random_seed with the derived nonzero TensorFlow seed immediately before each registered model construction; call enable_op_determinism once after TensorFlow import and before any TensorFlow operation."
device_reproducibility_scope = "Bitwise repeatability is required across reruns on the same device type, hardware model, driver/runtime, operating system, Python, TensorFlow, and Keras versions; CPU and GPU results are not compared bitwise. Any operation rejected as nondeterministic is a hard cell failure."

[framework.dropout]
layer = "keras.layers.Dropout"
rate = 0.3
seed_argument = "Pass the nonzero TensorFlow seed derived from the registered dropout namespace to Dropout(seed=seed) at construction."
federated_lifecycle = "For every client fit attempt, construct one fresh complete model and one fresh Dropout instance using round_index and client_id, load the round-start global weights, run exactly the registered local epoch, then discard the model; an infrastructure retry reconstructs from scratch with the same seeds, weights, batches, and optimizer state."
centralized_lifecycle = "Construct one model and one Dropout instance with round_index=-1 and client_id=-1, then retain that instance and its deterministic mask sequence across all 20 epochs; an infrastructure retry reconstructs the entire run from scratch."
local_only_lifecycle = "For each client_id 0 through 3, construct one model and one Dropout instance with round_index=-1, retain it across that model's 20 epochs, and discard it after final evaluation; an infrastructure retry of that model reconstructs it from scratch."
inference = "Invoke with training=False for validation, test, and privacy inference, so Dropout consumes no mask and changes no Dropout RNG state."

[training]
rounds = 20
local_epochs = 1
federated_fitted_row_exposures = 20
model_initialization_rng = "Set the framework seed from the model-initialization derived uint64 before constructing each model; construct models in registered layer order."
training_order_rng = "For each epoch, sort fitted official row indices, permute them once with the training-order PCG64 generator at attempt 0, materialize batches in that order, and disable framework reshuffling."
dropout_rng = "Derive the registered dropout seed once per Dropout instance, pass it as the layer seed argument, and follow framework.dropout lifecycle exactly; never reset or replace a live Dropout instance. No other stochastic layer is registered."
batch_size = 64
validation_fraction = 0.2
validation_sampling = "deterministic_stratified_within_train_partition"
early_stopping = false
optimizer = "adam"
learning_rate = 0.001
beta_1 = 0.9
beta_2 = 0.999
epsilon = 1e-7
amsgrad = false
update_noise = false

[strategies.centralized]
kind = "centralized"
training_epochs = 20
split_reference = "iid_stratified_at_4_clients_then_union_the_four_fitted_sets_and_union_the_four_validation_sets"
training_rows = "union_of_the_four_iid_stratified_fitted_training_sets"
validation_rows = "union_of_the_four_iid_stratified_registered_validation_sets"
fitted_row_exposures = 20
test_evaluation = "once_after_epoch_20"
validation_reporting = "report the registered validation metric curve for zero-based epoch indices 0 through 19"
convergence_round_reporting = "not_applicable_and_must_not_be_reported"

[strategies.local_only]
kind = "one_model_per_client"
client_scale = 4
models_per_cell = 4
training_epochs_per_model = 20
training_rows_per_model = "that_clients_fitted_training_rows_only"
fitted_row_exposures = 20
model_aggregation = "none"
prediction_aggregation = "none"
reporting = "retain raw predictions and classification metrics separately for each of the four client models; the cell summary is the unweighted arithmetic mean of each reported scalar metric across exactly four models"
test_evaluation = "each_model_once_after_epoch_20"
validation_reporting = "report each model's registered validation metric curve for zero-based epoch indices 0 through 19"
convergence_round_reporting = "not_applicable_and_must_not_be_reported"

[strategies.fedavg]
kind = "sample_weighted_mean"

[strategies.fedprox]
kind = "sample_weighted_mean_with_proximal_objective"
mu = 0.1
reference = "Immediately after loading round-start global model weights, create one immutable TensorFlow constant per model.trainable_weights entry in that order using keras.ops.convert_to_tensor(weight.numpy().copy()); create these before the first local optimizer step and reuse the same constants for every batch in that client's one local epoch."
data_loss = "Construct keras.losses.BinaryCrossentropy() with its Keras 3.14.0 defaults, which equal the registered from_logits, label_smoothing, axis, and sum_over_batch_size reduction. For each batch, evaluate it on the registered labels and attached-logit sigmoid output with no sample weights."
proximal_term = "In TensorFlow float32 and model.trainable_weights order, form one scalar term per variable with keras.ops.sum(keras.ops.square(local_weight-reference_weight)), then left-fold addition from the first term through the last and multiply by mu/2. Include every trainable scalar exactly once and no non-trainable variable."
local_objective = "data_loss + proximal_term; differentiate this scalar once with respect to model.trainable_variables and apply one Adam update per batch. The proximal term is one batch-level scalar and is not divided or multiplied by batch size."
client_update = "After the local epoch, each client submits its complete post-fit trainable and non-trainable model weights in model.weights order, plus its zero-based integer client_id in FitRes.metrics; it does not submit a delta."
aggregation_sample_weight = "The integer number of that client's fitted training rows supplied to the optimizer, excluding validation rows; retries do not change this weight."
aggregation = "Hard-fail if any successful FitRes lacks a unique non-negative integer client_id, then sort successful results by ascending client_id. Apply Flower 1.32.1 aggregate_inplace to the submitted post-fit weights: compute every client scaling factor as float64(client_sample_weight / sum(client_sample_weights)); for every weight tensor independently in its native float32 shape, cast each scaling factor to float32, multiply each submitted post-fit tensor by its factor, and left-fold numpy.add over those products in ascending client_id order. The resulting float32 tensors are the next global model; do not reconstruct or aggregate deltas."

[strategies.fedprox.golden_probe]
batch_example_losses = [0.2, 0.8]
current_trainable_variables = [[1.0, 2.0], [3.0]]
reference_trainable_variables = [[0.0, 2.0], [1.0]]
data_loss = 0.5
proximal_term = 0.25
local_objective = 0.75

[strategies.fedprox_huber]
kind = "fedprox_with_iterative_huber_aggregation"
mu = 0.1
threshold = 10.0
iterations = 10
epsilon = 1e-8
local_objective = "Exactly strategies.fedprox, including its immutable round-start reference, float32 proximal sum reduction, batch-level placement, and Adam update."
client_vector = "Hard-fail if any successful FitRes lacks a unique non-negative integer client_id, then sort successful results by ascending client_id. For each client in that order, apply any registered threat to its model delta, add the threatened delta to the common round-start global model, flatten each resulting complete post-fit model weight with numpy.ndarray.flatten() in default C order, and concatenate weights in model.weights order. Convert the stacked vectors to float32. All clients must have identical nonempty finite vector lengths or the cell hard-fails."
sample_weight = "Convert each positive integer strategies.fedprox aggregation_sample_weight to float64, divide the vector of weights by its float64 sum once, and retain these normalized base weights for every iteration."
initialization = "Set estimate_0 = numpy.average(client_vectors, axis=0, weights=normalized_base_weights). Float32 client vectors and float64 weights produce a float64 estimate."
residual_norm = "At iteration t, residual_i = numpy.linalg.norm(estimate_t - client_vector_i) with no ord argument, the float64 Euclidean norm over the complete flattened vector."
epsilon_rule = "If residual_i <= threshold, set scale_i=1.0 without using epsilon; otherwise set scale_i=threshold/(residual_i+epsilon) exactly."
huber_weight = "Set effective_weight_i = sample_weight_i * scale_i."
update = "For t=0 through 9, normalize effective weights by their sum, then set estimate_(t+1) = numpy.average(client_vectors, axis=0, weights=normalized_effective_weights), preserving ascending client_id order in float64. Execute exactly 10 updates with no early stopping. Hard-fail on non-finite values or a non-positive effective-weight sum."
reconstruction = "After iteration 10, split the float64 estimate_10 at the original model-weight element counts and reshape each part in C order to its reference model.weights shape without a dtype cast; serialize those arrays as the aggregated global parameters."

[strategies.fedprox_huber.golden_probe]
