[privacy.binary_crossentropy]
dtype = "float64"
clip_minimum = 1e-7
clip_maximum = 0.9999999
formula = "q=minimum(maximum(p,clip_minimum),clip_maximum); loss=-(y*log(q)+(1-y)*log1p(-q)); score=-loss"
reduction = "none"

[[privacy.binary_crossentropy.golden_vectors]]
labels = [1, 0, 1, 0]
probabilities = [0.9, 0.2, 0.00000001, 0.99999999]
losses = [0.10536051565782628, 0.22314355131420976, 16.11809565095832, 16.118095651484676]

[metrics.classification]
raw_predictions = true
confusion_matrix_order = [["TN", "FP"], ["FN", "TP"]]
reported = ["accuracy", "precision", "recall", "f1", "roc_auc"]
positive_label = 1
zero_division = 0

[metrics.system]
convergence_scope = "federated matrices only: primary_federated, scale, and robustness"
convergence = "first zero-based federated round index whose registered validation accuracy is at least 0.95 times the maximum registered validation accuracy over round indices 0 through 19"
convergence_evaluation_data = "union_of_registered_train_split_validation_rows"
pre_training_state_included_for_convergence = false
centralized_local_only_curves = "centralized and local_only report registered validation metric curves over zero-based epoch indices 0 through 19 and never report convergence_round"
test_evaluation_schedule = "final_trained_model_only_after_round_20_or_epoch_20_and_never_for_convergence"
client_fit_timer = "time.perf_counter_ns"
client_fit_timer_start = "immediately_before_invoking_the_clients_model_fit_training_call_after_parameters_and_fitted_batches_are_ready"
client_fit_timer_stop = "immediately_after_the_training_call_returns_or_raises_and_before_update_serialization_or_metric_evaluation"
client_fit_timer_retry_rule = "Record each attempt separately and include every attempt duration in the registered per-round, per-model, and per-run sums; a supervisor-terminated timeout records elapsed nanoseconds from the same start boundary through termination."
client_fit_timer_report_unit = "nanoseconds"
federated_round_reduction = "For each round, sum client fit attempt durations over every client in ascending client_id order and over every initial attempt, failed attempt, timeout, and retry; overlapping client wall-clock intervals remain additive compute time."
federated_run_reduction = "Sum the 20 federated round totals to client_training_time_ns for the cell and seed. Do not average by clients, rounds, successful attempts, or retries."
local_only_model_reduction = "For each of the four local models, sum every initial and retried 20-epoch fit-call duration to model_training_time_ns; local-only cell training_time_ns is the sum of the four model totals in client_id order."
local_only_timer_boundaries = "For each local model and attempt, use the client_fit_timer_start and client_fit_timer_stop boundaries around its single model.fit call covering epochs 0 through 19."
centralized_timer_start = "immediately before the single model.fit call covering registered epochs 0 through 19, after the model, optimizer, fitted batches, and validation batches are ready"
centralized_timer_stop = "immediately after that model.fit call returns or raises and before final test or privacy evaluation"
centralized_retry_reduction = "centralized training_time_ns is the sum of every initial and retried full-fit attempt duration, including failed and supervisor-terminated attempts"
statistics_reduction = "Retain one reduced training-time scalar per cell and seed; apply only the registered five-seed statistics afterward. Never sum timing across seeds, strategies, partitions, threats, or matrix cells."
communication_volume = "exact_serialized_application_bytes"
communication_flower_version = "1.32.1"
communication_serialization_boundary = "complete Flower application Message byte string after application serialization and immediately before transport framing"
communication_counting_point = "sender_once_per_message"
communication_directions = ["server_to_client", "client_to_server"]
communication_included_messages = ["fit_request", "fit_response"]
communication_evaluation_messages = "none because registered validation and final evaluation execute at the server"
communication_excluded_bytes = ["transport_framing", "grpc_http2_headers", "tls", "tcp_ip", "lower_layer_retransmissions", "liveness_and_control_messages"]
communication_retry_rule = "count every complete application message emitted by every initial attempt and retry; count a response only when its complete byte string is emitted; never double-count the receiver copy"
communication_reporting = "report server_to_client_bytes client_to_server_bytes and their exact sum per run"
reported_federated = ["convergence_round", "communication_bytes", "client_training_time_ns"]
reported_centralized_local_only = ["epoch_validation_curve", "training_time_ns"]

