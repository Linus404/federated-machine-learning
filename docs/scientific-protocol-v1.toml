[strategies.fedavg]
kind = "sample_weighted_mean"
aggregation_input = "Exactly aggregation.submitted_value and aggregation.coordinate_layout."
sample_weighting = "Use FitRes.num_examples after aggregation.sample_count_validation; no other weight is permitted."
executable = "Call flwr.server.strategy.aggregate.aggregate_inplace from Flower 1.32.1 once with the ascending-client-ID list of (ClientProxy, FitRes) pairs."
scaling_factors = "Inside aggregate_inplace, compute num_examples_total with Python sum over ascending-client-ID FitRes.num_examples, then construct numpy.asarray([fit_res.num_examples / num_examples_total for each result]) with no dtype argument. Python true division produces binary64 Python floats and numpy.asarray produces a float64 vector."
reduction = "For each tensor, multiply every client's submitted float32 array by its numpy.float64 scaling-factor scalar in ascending client_id order through Flower 1.32.1 _try_inplace. NumPy 2.4.4 numpy.can_cast(factor,numpy.float32,casting='same_kind') is true, so execute numpy.multiply(array,factor,out=array) without constructing a float32 factor; the ufunc computes the float64 product and stores its cast result in the float32 array. Use the scaled client 0 array as the accumulator and, for clients 1 through client_scale-1, execute numpy.add(accumulator,scaled_client_array,out=accumulator) as a strict float32 left fold."
result = "The float32 accumulator tensors, reconstructed in unchanged model.weights order and shapes, are the next round-start global weights. Do not aggregate deltas and do not add the previous global weights after reduction."
invalid_inputs = "Exactly aggregation.common_invalid_inputs. Flower warnings, implicit casts, broadcasting, unequal zip truncation, zero-division, or NaN/Inf propagation are not accepted alternatives."

