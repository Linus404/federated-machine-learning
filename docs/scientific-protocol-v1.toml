[framework]
tensorflow_version = "2.20.0"
keras_version = "3.14.0"
numpy_version = "2.4.4"
keras_backend = "tensorflow"
version_check = "Hard-fail before preprocessing, partitioning, or training unless tensorflow.__version__, keras.__version__, and numpy.__version__ exactly match the registered versions."
