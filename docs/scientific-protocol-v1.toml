[preprocessing]
input_dtype = "tf.string"
unicode_normalization = "none"
html_removal = "tf.strings.regex_replace(text, '<[^>]+>', ' ') using TensorFlow RE2 semantics"
lowercase = "tf.strings.lower"
lowercase_semantics = "Under TensorFlow 2.20.0, tf.strings.lower maps ASCII U+0041 through U+005A to U+0061 through U+007A and preserves every non-ASCII UTF-8 code point exactly; no Unicode case folding or normalization occurs."
punctuation_characters = '''!"#$%&'()*+,-./:;<=>?@[\]^_`{|}~'''
punctuation_handling = "Delete every ASCII string.punctuation code point with tf.strings.regex_replace; do not replace punctuation with whitespace."
standardization_order = ["html_removal", "ascii_lowercase", "ascii_punctuation_deletion"]
standardize_python = '''def protocol_standardize(text):
    text = tf.strings.regex_replace(text, "<[^>]+>", " ")
    text = tf.strings.lower(text)
    return tf.strings.regex_replace(text, "[" + re.escape(string.punctuation) + "]", "")'''
tokenization = "keras.layers.TextVectorization split='whitespace' delegates to tf.strings.split with sep=None. Under TensorFlow 2.20.0, only maximal nonempty runs of ASCII HT, LF, VT, FF, CR, and SPACE (U+0009 through U+000D and U+0020) delimit tokens; leading and trailing delimiters and empty tokens are discarded. Non-ASCII whitespace, including U+00A0, U+2003, U+2028, and U+2029, remains inside tokens."
max_tokens = 20000
reserved_tokens = ["", "[UNK]"]
padding_token_id = 0
oov_token = "[UNK]"
oov_token_id = 1
oov_buckets = 1
learned_token_limit = 19998
output_mode = "int"
output_sequence_length = 500
truncation = "post_retain_the_first_500_tokens"
padding = "post_append_token_id_0_to_length_500"
layer_dtype = "string"
output_dtype = "int64"
vectorizer_python = '''keras.layers.TextVectorization(max_tokens=20000, standardize=protocol_standardize, split="whitespace", output_mode="int", output_sequence_length=500, pad_to_max_tokens=False)'''
adaptation_split = "official_train_entire_25000_rows_labels_ignored_test_and_unsupervised_excluded"
adaptation_order = "ascending_zero_based_official_train_row_index"
adaptation_batch_size = 256
adaptation_python = '''texts = list(dataset["text"])
vectorizer.adapt(tf.data.Dataset.from_tensor_slices(texts).batch(256, drop_remainder=False))'''
adaptation_lifecycle = "Construct and adapt exactly one vectorizer before any partitioning; freeze get_vocabulary and use that identical ordered vocabulary for every client, centralized model, local-only model, seed, partition, and privacy analysis. Never call adapt again."
vocabulary_serialization = "For each get_vocabulary item in index order including the empty padding token and [UNK], append its UTF-8 bytes then one LF byte; include the final LF."
vocabulary_hash_algorithm = "sha256"
vocabulary_size = 20000
vocabulary_sha256 = "021e9f054e1b1ad4622fdb87d6d98f17337d202cc35faefdcfd8ae15a3887b9b"
vocabulary_verification = "Hard-fail before the first cell unless both get_vocabulary length and serialized SHA-256 equal vocabulary_size and vocabulary_sha256."

