seed_api = "keras.utils.set_random_seed(tensorflow_seed)"
seed_api_order = "Call keras.utils.set_random_seed with the derived nonzero TensorFlow seed immediately before each registered model construction; call enable_op_determinism once after TensorFlow import and before any TensorFlow operation."
device_reproducibility_scope = "Bitwise repeatability is required across reruns on the same device type, hardware model, driver/runtime, operating system, Python, TensorFlow, and Keras versions; CPU and GPU results are not compared bitwise. Any operation rejected as nondeterministic is a hard cell failure."

[framework.dropout]
layer = "keras.layers.Dropout"
rate = 0.3
seed_argument = "Pass the nonzero TensorFlow seed derived from the registered dropout namespace to Dropout(seed=seed) at construction."
federated_lifecycle = "For every client fit attempt, construct one fresh complete model and one fresh Dropout instance using round_index and client_id, load the round-start global weights, run exactly the registered local epoch, then discard the model; an infrastructure retry reconstructs from scratch with the same seeds, weights, batches, and optimizer state."
centralized_lifecycle = "Construct one model and one Dropout instance with round_index=-1 and client_id=-1, then retain that instance and its deterministic mask sequence across all 20 epochs; an infrastructure retry reconstructs the entire run from scratch."
local_only_lifecycle = "For each client_id 0 through 3, construct one model and one Dropout instance with round_index=-1, retain it across that model's 20 epochs, and discard it after final evaluation; an infrastructure retry of that model reconstructs it from scratch."
inference = "Invoke with training=False for validation, test, and privacy inference, so Dropout consumes no mask and changes no Dropout RNG state."

[training]
rounds = 20
local_epochs = 1
federated_fitted_row_exposures = 20
model_initialization_rng = "Set the framework seed from the model-initialization derived uint64 before constructing each model; construct models in registered layer order."
training_order_rng = "For each epoch, sort fitted official row indices, permute them once with the training-order PCG64 generator at attempt 0, materialize batches in that order, and disable framework reshuffling."
dropout_rng = "Derive the registered dropout seed once per Dropout instance, pass it as the layer seed argument, and follow framework.dropout lifecycle exactly; never reset or replace a live Dropout instance. No other stochastic layer is registered."
batch_size = 64
validation_fraction = 0.2
validation_sampling = "deterministic_stratified_within_train_partition"
early_stopping = false
optimizer = "adam"
learning_rate = 0.001
beta_1 = 0.9
beta_2 = 0.999
epsilon = 1e-7
amsgrad = false
update_noise = false

[aggregation]
flower_version = "1.32.1"
numpy_version = "2.4.4"
result_set = "A registered round contains exactly one successful FitRes for every registered client and no failures. Zero successful results, any failure, or a missing registered client hard-fails the cell; partial-round aggregation is forbidden."
client_validation = "Before parameters are decoded, require every FitRes.metrics client_id to have Python type int but not bool, to be in the inclusive range 0 through client_scale-1, and to be unique; require the resulting ID set to equal range(client_scale), then sort FitRes objects by ascending client_id."
sample_count_validation = "Require every FitRes.num_examples to have Python type int but not bool, to be positive, and to equal that client's registered fitted-row count."
model_validation = "Decode every FitRes.parameters with flwr.common.parameters_to_ndarrays. Require a nonempty model-weight list; require every array to have dtype exactly numpy.float32, contain only finite values, and match the corresponding round-start model.weights shape; require every client to have the same weight count and shapes. Scalars and zero-element arrays are forbidden."
submitted_value = "The aggregation input is each client's complete post-fit model.weights list after the threat transformation below, never a pre-aggregated update or delta. Honest clients retain their decoded post-fit arrays bit-for-bit."
threat_order = "First complete the honest local epoch and decode the complete honest post-fit weights. Second validate client IDs, sample counts, round-start weights, and every honest post-fit array. Third, only for selected malicious clients and independently for each model.weights tensor in model.weights order, execute the registered threat transformation. Fourth, aggregate the resulting complete submitted weights. Never aggregate honest weights before applying a threat."
threat_transformation = "For each selected malicious client's corresponding float32 honest post-fit tensor H and common float32 round-start tensor G, execute D=numpy.subtract(H,G), T=numpy.multiply(D,numpy.float32(threat_scale)), and S=numpy.add(G,T), using NumPy 2.4.4 defaults with no dtype argument or out argument. D, T, and S remain float32. Use threat_scale=10.0 for outlier and -10.0 for sign_flip. S replaces H as that client's complete submitted tensor. Hard-fail if D, T, or S is non-finite."
coordinate_layout = "For mathematical indexing and golden probes only, flatten every submitted tensor separately with numpy.ndarray.flatten(order='C'), concatenate those vectors in model.weights order, and number coordinates from zero. Reconstruct by splitting at the original tensor element counts and applying numpy.reshape(part, original_shape, order='C') with no dtype cast. The executable Flower calls operate tensor-by-tensor and are bitwise equivalent to this coordinate layout; coordinates never mix."
common_invalid_inputs = "Hard-fail the cell before aggregation for any result-set, client-ID, sample-count, model, threat-intermediate, flattening, or reconstruction violation above. Also hard-fail if the selected strategy returns a different tensor count or shape, a non-float32 dtype, or any non-finite value. No invalid registered input may be skipped, repaired, clipped, cast, partially aggregated, or assigned a fallback result. The explicit strategies.fedprox_huber reconstruction cast is part of that valid strategy's registered output formula and is not input repair."

