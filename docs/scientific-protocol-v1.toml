protocol_version = 1
name = "federated-imdb-scientific-protocol"
status = "frozen"
amendment_policy = "Changes require a separately reviewed protocol version before comparative results are produced."

[dataset]
id = "stanfordnlp/imdb"
config = "plain_text"
revision = "e6281661ce1c48d982bc483cf8a173c1bbeb5d31"
datasets_version = "4.8.5"
raw_hash_algorithm = "sha256"
content_hash_algorithm = "sha256"
content_hash_serialization = "For each row in dataset order, encode compact UTF-8 JSON with sorted keys label and text, then one newline."
content_hash_python = '''json.dumps({"label": int(row["label"]), "text": row["text"]}, ensure_ascii=False, sort_keys=True, separators=(",", ":"), allow_nan=False).encode("utf-8") + b"\n"'''
content_hash_json_ensure_ascii = false
content_hash_json_separators = [",", ":"]
content_hash_json_sort_keys = true
content_hash_json_allow_nan = false
content_hash_unicode_normalization = "none_preserve_dataset_code_points_exactly"

[dataset.sources]
dataset_api = "https://huggingface.co/api/datasets/stanfordnlp/imdb"
refs_api = "https://huggingface.co/api/datasets/stanfordnlp/imdb/refs"
revision_tree_api = "https://huggingface.co/api/datasets/stanfordnlp/imdb/tree/e6281661ce1c48d982bc483cf8a173c1bbeb5d31"
loading_documentation = "https://huggingface.co/docs/datasets/loading"

[dataset.splits.train]
rows = 25000
label_counts = [12500, 12500]
label_index_ranges = [[0, 12499], [12500, 24999]]
use = "training_and_deterministic_validation_only"
raw_parquet_sha256 = "db47d16b5c297cc0dd625e519c81319c24c9149e70e8496de5475f6fa928342c"
content_sha256 = "4639bf1063fddebc3d7a446004a1032832227b0d3d28b01f58f99a4f94c0ab8a"

[dataset.splits.test]
rows = 25000
label_counts = [12500, 12500]
label_index_ranges = [[0, 12499], [12500, 24999]]
use = "sole_untouched_global_test_set"
raw_parquet_sha256 = "b52e26e2f872d282ffac460bf9770b25ac6f102cda0e6ca7158df98c94e8b3da"
content_sha256 = "48168f7787435514498e777646a1312897c1207d239c61acdde5e049bc3f1a3f"

[dataset.splits.unsupervised]
rows = 50000
use = "excluded"
raw_parquet_sha256 = "74d14fbfcbb39fb7d299c38ca9f0ae6d231bf97108da85d620027ba437b6d52e"
content_sha256 = "d56c24962d82526173fc9fab14b820873ea281d64ab11915ec12eaf73f65deeb"

[untouched_test]
split = "test"
sole_global_test_set = true
available_to_client_training = false
available_to_validation = false
available_to_tuning = false
available_to_model_selection = false
available_to_partitioning = false
access = "registered_final_model_evaluation_and_registered_privacy_analysis_only"
decision_threshold = 0.5
threshold_comparison = "probability_greater_than_or_equal"
selection_rule = "Never tune thresholds, hyperparameters, strategies, stopping, or model selection on test results."
train_split_use = "Only the official train split may supply training and deterministic stratified validation rows."

[seeding]
seeds = [67, 101, 211, 307, 401]
application = ["partitioning", "validation_split", "model_initialization", "training_order", "dropout", "threat_construction", "privacy_sampling"]
hash_algorithm = "sha256"
seed_material = "master_seed_pipe_namespace_pipe_attempt_encoded_as_ascii"
uint64_byte_slice = "first_8_digest_bytes"
uint64_byte_order = "big"
python_derivation = '''int.from_bytes(hashlib.sha256(f"{master_seed}|{namespace}|{attempt}".encode("ascii")).digest()[:8], "big", signed=False)'''
numpy_generator = "numpy.random.Generator(numpy.random.PCG64(derived_uint64))"
tensorflow_seed = "derived_uint64_modulo_2147483647_with_zero_replaced_by_one"
default_attempt = 0
namespace_is_utf8_ascii = true
namespace_reuse_forbidden = true
generator_lifecycle = "Derive one uint64 for one fully expanded namespace and attempt, instantiate exactly one numpy.random.Generator with PCG64 from it, execute only that namespace's registered stochastic operation, then discard the generator. Never share or reuse a Generator across namespaces, labels, clients, rounds, epochs, attempts, cells, or master seeds."
label_namespace_rule = "Every stochastic operation performed separately by label has a distinct namespace ending in label-{label}; derive and instantiate its Generator independently."

[seeding.cell_id]
fields = ["matrix_kind", "strategy", "partition", "alpha", "client_scale", "seed", "threat"]
serialization = "compact_sorted_json"
serialization_is_identifier = true
python_serialization = '''json.dumps({"matrix_kind": matrix_kind, "strategy": strategy, "partition": partition, "alpha": alpha, "client_scale": client_scale, "seed": seed, "threat": threat}, ensure_ascii=True, sort_keys=True, separators=(",", ":"), allow_nan=False)'''
matrix_kind = "Exact subsection name under matrix: primary_federated, centralized, local_only, scale, robustness, membership_inference, or update_leakage."
strategy = "Registered training strategy; for privacy analysis cells this is the source model name from the matrix models list."
partition = "Registered partition name, or JSON null for centralized cells and centralized membership-inference cells."
alpha = "Dirichlet alpha as a JSON number for dirichlet partitions, or JSON null for iid_stratified and non-partitioned cells."
client_scale = "Registered integer client scale, or JSON null for centralized cells and centralized membership-inference cells."
seed = "Registered integer master seed, not its ordinal position."
threat = '''JSON null outside robustness. For robustness, exactly {"attack": <registered attack string>, "malicious_fraction": <registered JSON number>}; no other threat keys are permitted.'''
canonical_example = '''{"alpha":0.5,"client_scale":4,"matrix_kind":"robustness","partition":"dirichlet_0.5","seed":67,"strategy":"fedavg","threat":{"attack":"outlier","malicious_fraction":0.25}}'''

[seeding.namespaces]
partition_iid = "partition/iid/{client_scale}/round--1/epoch--1/client--1/label-{label}"
partition_dirichlet = "partition/{partition_name}/{client_scale}/round--1/epoch--1/client--1/label-{label}"
validation = "validation/{partition_name}/{client_scale}/round--1/epoch--1/client-{client_id}/label-{label}"
model_initialization = "model/{cell_id}/round--1/epoch--1/client-{client_id}"
training_order = "training/{cell_id}/round-{round_index}/epoch-{epoch_index}/client-{client_id}"
dropout = "dropout/{cell_id}/round-{round_index}/epoch-{epoch_index}/client-{client_id}"
malicious_order = "malicious-order/dirichlet_0.5/4/round--1/epoch--1/client--1"
membership_member = "privacy/membership/{cell_id}/member/round--1/epoch--1/client--1/label-{label}"
membership_nonmember = "privacy/membership/{cell_id}/nonmember/round--1/epoch--1/client--1/label-{label}"
update_member = "privacy/update-leakage/{cell_id}/member/round-{round_index}/epoch--1/client-{client_id}/label-{label}"
update_nonmember = "privacy/update-leakage/{cell_id}/nonmember/round-{round_index}/epoch--1/client-{client_id}/label-{label}"

[indexing]
all_indices_zero_based = true
non_applicable_seed_namespace_index = -1
federated_round_indices = "integers from 0 through 19"
federated_epoch_indices_per_round = [0]
centralized_epoch_indices = "integers from 0 through 19"
local_only_epoch_indices = "integers from 0 through 19"
client_indices = "integers from 0 through client_scale minus 1"
label_indices = [0, 1]
seed_namespace_rule = "Every seed namespace that contains round, epoch, or client dimensions uses the zero-based index when applicable and the literal sentinel -1 when not applicable; the rendered sentinel therefore appears as round--1, epoch--1, or client--1."

[indexing.namespace_contexts]
federated_training = { round_index = "0_through_19", epoch_index = 0, client_id = "0_through_client_scale_minus_1" }
centralized_training = { round_index = -1, epoch_index = "0_through_19", client_id = -1 }
local_only_training = { round_index = -1, epoch_index = "0_through_19", client_id = "0_through_3" }
global_model_initialization = { round_index = -1, epoch_index = -1, client_id = -1 }
local_only_model_initialization = { round_index = -1, epoch_index = -1, client_id = "0_through_3" }

[partitioning]
registered = ["iid_stratified", "dirichlet_1.0", "dirichlet_0.5", "dirichlet_0.1"]
dirichlet_alphas = [1.0, 0.5, 0.1]
minimum_samples_per_client = 32
first_attempt = 0
last_attempt = 9999
attempt_seed_rule = "derive_deterministically_from_experiment_seed_and_attempt"
acceptance_rule = "Accept the first attempt in ascending order where every client has at least 32 samples; fail after attempt 9999."
client_scales = [4, 16, 64]
primary_client_scale = 4
row_identity = "zero_based_official_split_row_index"
labels = [0, 1]
client_id_format = "client-{zero_based_integer}"

[partitioning.iid]
algorithm = "For each label in ascending order, sort row indices, derive its label-specific namespace at attempt 0, instantiate a new PCG64 Generator, permute the rows once, discard the Generator, split with numpy.array_split into client_scale parts in ascending client ID order, concatenate both label parts per client, then sort each client shard by row index."
attempt = 0
balance = "per_label_part_sizes_differ_by_at_most_one"

[partitioning.dirichlet]
algorithm = "For each attempt and each label in ascending order, sort its row indices, derive that label's partition namespace with the current attempt, instantiate a new PCG64 Generator, call generator.permutation, generator.dirichlet with client_scale copies of alpha, and generator.multinomial with the label row count and those probabilities, then discard the Generator and assign consecutive permuted rows to clients in ascending ID order using those counts. Concatenate both label allocations per client and sort each shard by row index."
retry_scope = "discard_every_client_allocation_and_restart_with_next_attempt"
acceptance_checked_after_both_labels = true

[partitioning.validation]
algorithm = "Within each accepted client shard and each label in ascending order, sort row indices, derive the client-and-label-specific validation namespace at attempt 0, instantiate a new PCG64 Generator, permute once, discard the Generator, assign the first floor(label_count_times_0.2) rows to validation and all remaining rows to fitted training, then sort both resulting index sets."
validation_union_use = "server_held_per_round_global_validation_only"
fitted_rows_use = "optimizer_input_only"

[selection.clients]
fit_participation = "all_registered_clients_every_round"
evaluation_participation = "all_registered_clients_every_round"
order = "ascending_numeric_client_id"
random_sampling = false

[selection.malicious]
algorithm = "At attempt 0, instantiate one PCG64 Generator for the malicious-order namespace, permute ascending client IDs once, discard the Generator, and for malicious count k choose the first k IDs and sort the chosen IDs for execution."
pairing = "Reuse the same seeded permutation across all robustness strategies, attacks, and malicious fractions for one master seed; the one-client set is a subset of the two-client set."

[model]
revision = "sentiment-cnn-v1"
vocabulary_size = 20000
sequence_length = 500
embedding_dimension = 100
embedding_trainable = true
padding_token_id = 0
padding_masked_before_convolution = true
convolution_filters = 64
convolution_kernel_size = 3
convolution_padding = "same"
convolution_activation = "relu"
convolution_use_bias = false
pooling = "global_max_1d"
hidden_units = 32
hidden_activation = "relu"
dropout_rate = 0.3
output_units = 1
output_activation = "sigmoid"
loss = "binary_crossentropy"

[training]
rounds = 20
local_epochs = 1
federated_fitted_row_exposures = 20
model_initialization_rng = "Set the framework seed from the model-initialization derived uint64 before constructing each model; construct models in registered layer order."
training_order_rng = "For each epoch, sort fitted official row indices, permute them once with the training-order PCG64 generator at attempt 0, materialize batches in that order, and disable framework reshuffling."
dropout_rng = "Set the framework seed from the dropout derived uint64 immediately before each registered epoch; no other stochastic layer is registered."
batch_size = 64
validation_fraction = 0.2
validation_sampling = "deterministic_stratified_within_train_partition"
early_stopping = false
optimizer = "adam"
learning_rate = 0.001
beta_1 = 0.9
beta_2 = 0.999
epsilon = 1e-7
amsgrad = false
update_noise = false

[strategies.centralized]
kind = "centralized"
training_epochs = 20
split_reference = "iid_stratified_at_4_clients_then_union_the_four_fitted_sets_and_union_the_four_validation_sets"
training_rows = "union_of_the_four_iid_stratified_fitted_training_sets"
validation_rows = "union_of_the_four_iid_stratified_registered_validation_sets"
fitted_row_exposures = 20
test_evaluation = "once_after_epoch_20"
validation_reporting = "report the registered validation metric curve for zero-based epoch indices 0 through 19"
convergence_round_reporting = "not_applicable_and_must_not_be_reported"

[strategies.local_only]
kind = "one_model_per_client"
client_scale = 4
models_per_cell = 4
training_epochs_per_model = 20
training_rows_per_model = "that_clients_fitted_training_rows_only"
fitted_row_exposures = 20
model_aggregation = "none"
prediction_aggregation = "none"
reporting = "retain raw predictions and classification metrics separately for each of the four client models; the cell summary is the unweighted arithmetic mean of each reported scalar metric across exactly four models"
test_evaluation = "each_model_once_after_epoch_20"
validation_reporting = "report each model's registered validation metric curve for zero-based epoch indices 0 through 19"
convergence_round_reporting = "not_applicable_and_must_not_be_reported"

[strategies.fedavg]
kind = "sample_weighted_mean"

[strategies.fedprox]
kind = "sample_weighted_mean_with_proximal_objective"
mu = 0.1

[strategies.fedprox_huber]
kind = "fedprox_with_iterative_huber_aggregation"
mu = 0.1
threshold = 10.0
iterations = 10
epsilon = 1e-8

[strategies.fedmedian]
kind = "coordinate_wise_median"
assumption = "Requires fewer than 50 percent Byzantine values at each coordinate."

[strategies.fedtrimmedavg]
kind = "coordinate_wise_trimmed_mean"
beta = 0.25
trim_count_rule = "floor(beta_times_client_count)_per_side"
assumption = "Robustness requires Byzantine values to occupy the trimmed extremes; no guarantee is claimed at 50 percent malicious clients."

[threats]
client_scale = 4
partition = "dirichlet_0.5"
malicious_fractions = [0.25, 0.5]
malicious_client_counts = [1, 2]
update_source = "malicious_client_model_delta"

[threats.outlier]
transformation = "submitted_delta_equals_10_times_honest_delta"
scale = 10.0

[threats.sign_flip]
transformation = "submitted_delta_equals_negative_10_times_honest_delta"
scale = -10.0

[privacy.membership_inference]
access = "black_box_prediction_probabilities"
knowledge = "candidate_records_and_membership_labels_for_the_balanced_attack_sample"
member_source = "fitted_training_rows_actually_supplied_to_the_model_optimizer"
nonmember_source = "official_test_split"
member_records = 1000
nonmember_records = 1000
records_per_class_per_membership = 500
sampling_replacement = false
sampling_algorithm = "For members and nonmembers separately and for labels 0 then 1, sort eligible official row indices, derive the pool-and-label-specific namespace at attempt 0, instantiate a new PCG64 Generator, permute once, discard the Generator, and take the first 500. Concatenate member label-0, member label-1, nonmember label-0, and nonmember label-1 records in that order; hard-fail if any pool-label has fewer than 500 eligible rows."
membership_positive_label = 1
membership_negative_label = 0
prediction_clip_minimum = 1e-7
prediction_clip_maximum = 0.9999999
per_example_loss = "negative_y_times_log_p_plus_one_minus_y_times_log_one_minus_p_using_clipped_probability"
attack_score = "negative_per_example_binary_crossentropy_loss_so_larger_means_more_likely_member"
success_metrics = ["roc_auc", "max_tpr_minus_fpr", "tpr_at_1_percent_fpr"]

[privacy.update_leakage]
attacker = "honest_but_curious_server"
access = ["individual_client_update", "current_global_model", "candidate_records"]
target_round_index = 0
selected_client = "lowest numeric zero-based client_id whose accepted fitted partition contains at least records_per_class_per_target_label rows of label 0 and at least that many rows of label 1; hard-fail the update-leakage cell if no client qualifies"
selected_client_feasibility = "The fixed count 500 is feasible for every registered master seed under dirichlet_0.5 with 4 clients; executable offline protocol tests derive the exact selected client for all five seeds."
pre_update_model = "global model sent to selected_client at the start of zero-based round index 0"
individual_client_update = "flatten in model trainable-variable order each selected_client post-fit weight minus the corresponding pre-update global weight"
member_source = "selected_client fitted training rows"
nonmember_source = "union of all non-selected clients fitted training rows from the same accepted partition"
member_records = 1000
nonmember_records = 1000
records_per_class_per_target_label = 500
sampling_replacement = false
sampling_algorithm = "For target members and target nonmembers separately and for labels 0 then 1, sort eligible official train row indices, derive the pool-and-label-specific namespace containing target_round_index and selected_client at attempt 0, instantiate a new PCG64 Generator, permute once, discard the Generator, and take the first 500. Concatenate member label-0, member label-1, nonmember label-0, and nonmember label-1 records in that order; hard-fail if no selected client exists or any pool-label has fewer than 500 eligible rows."
target_membership_positive_label = 1
target_membership_negative_label = 0
gradient_model = "pre_update_model"
gradient_loss = "per_example_binary_crossentropy_with_true_sentiment_label_and_probability_clipped_to_1e-7_through_0.9999999"
gradient_vector = "negative_gradient_of_loss_flattened_in_model_trainable_variable_order"
score = "dot(gradient_vector,individual_client_update)_divided_by_product_of_l2_norms"
zero_norm_score = 0.0
score_direction = "larger_means_more_likely_fitted_by_target_client"
success_metrics = ["roc_auc", "max_tpr_minus_fpr", "tpr_at_1_percent_fpr"]

[metrics.classification]
raw_predictions = true
confusion_matrix_order = [["TN", "FP"], ["FN", "TP"]]
reported = ["accuracy", "precision", "recall", "f1", "roc_auc"]
positive_label = 1
zero_division = 0

[metrics.system]
convergence_scope = "federated matrices only: primary_federated, scale, and robustness"
convergence = "first zero-based federated round index whose registered validation accuracy is at least 0.95 times the maximum registered validation accuracy over round indices 0 through 19"
convergence_evaluation_data = "union_of_registered_train_split_validation_rows"
pre_training_state_included_for_convergence = false
centralized_local_only_curves = "centralized and local_only report registered validation metric curves over zero-based epoch indices 0 through 19 and never report convergence_round"
test_evaluation_schedule = "final_trained_model_only_after_round_20_or_epoch_20_and_never_for_convergence"
client_fit_timer = "time.perf_counter_ns"
client_fit_timer_start = "immediately_before_invoking_the_clients_model_fit_training_call_after_parameters_and_fitted_batches_are_ready"
client_fit_timer_stop = "immediately_after_the_training_call_returns_or_raises_and_before_update_serialization_or_metric_evaluation"
client_fit_timer_retry_rule = "record_each_attempt_separately_and_sum_all_attempt_durations_in_campaign_totals; a supervisor-terminated timeout records elapsed nanoseconds from the same start boundary through termination"
client_fit_timer_report_unit = "nanoseconds"
communication_volume = "exact_serialized_application_bytes"
communication_flower_version = "1.32.1"
communication_serialization_boundary = "complete Flower application Message byte string after application serialization and immediately before transport framing"
communication_counting_point = "sender_once_per_message"
communication_directions = ["server_to_client", "client_to_server"]
communication_included_messages = ["fit_request", "fit_response", "evaluate_request", "evaluate_response"]
communication_excluded_bytes = ["transport_framing", "grpc_http2_headers", "tls", "tcp_ip", "lower_layer_retransmissions", "liveness_and_control_messages"]
communication_retry_rule = "count every complete application message emitted by every initial attempt and retry; count a response only when its complete byte string is emitted; never double-count the receiver copy"
communication_reporting = "report server_to_client_bytes client_to_server_bytes and their exact sum per run"
reported_federated = ["convergence_round", "communication_bytes", "client_training_time"]
reported_centralized_local_only = ["epoch_validation_curve", "client_training_time"]

[statistics]
replicates = 5
raw_per_run_metrics = true
mean = true
sample_variance = true
sample_standard_deviation = true
confidence_interval = 0.95
confidence_interval_method = "two_sided_student_t"
t_critical = 2.776
variance_ddof = 1
paired_deltas = true
paired_by = "seed"
paired_delta_baselines = ["fedavg", "iid_stratified", "4_clients", "no_attack"]

[matrix.primary_federated]
strategies = ["fedavg", "fedprox", "fedprox_huber", "fedmedian", "fedtrimmedavg"]
partitions = ["iid_stratified", "dirichlet_1.0", "dirichlet_0.5", "dirichlet_0.1"]
seeds = 5
client_scale = 4
cells = 100

[matrix.centralized]
strategies = ["centralized"]
seeds = 5
cells = 5

[matrix.local_only]
strategies = ["local_only"]
partitions = ["iid_stratified", "dirichlet_1.0", "dirichlet_0.5", "dirichlet_0.1"]
seeds = 5
client_scale = 4
cells = 20
training_invocations_per_cell = 4
training_invocations = 80

[matrix.scale]
strategies = ["fedavg", "fedprox_huber"]
partitions = ["iid_stratified", "dirichlet_1.0", "dirichlet_0.5", "dirichlet_0.1"]
seeds = 5
client_scales = [16, 64]
cells = 80

[matrix.robustness]
strategies = ["fedavg", "fedprox_huber", "fedmedian", "fedtrimmedavg"]
attacks = ["outlier", "sign_flip"]
malicious_fractions = [0.25, 0.5]
seeds = 5
client_scale = 4
partition = "dirichlet_0.5"
cells = 80

[matrix.membership_inference]
models = ["centralized", "fedavg"]
seeds = 5
centralized_model_source = "matrix.centralized_same_seed_final_model"
fedavg_model_source = "matrix.primary_federated_fedavg_dirichlet_0.5_4_clients_same_seed_final_model"
fedavg_client_scale = 4
fedavg_partition = "dirichlet_0.5"
cells = 10

[matrix.update_leakage]
models = ["fedavg"]
seeds = 5
fedavg_model_source = "matrix.primary_federated_fedavg_dirichlet_0.5_4_clients_same_seed_round_index_0_selected_client_update"
client_scale = 4
partition = "dirichlet_0.5"
cells = 5

[matrix.totals]
maximum_cells = 300
planned_training_invocations = 345
maximum_training_invocations = 360
training_invocation_retry_reserve = 15
analysis_only_cells = 15
privacy_analyses_reuse_trained_models = true

[budget]
maximum_cells = 300
planned_training_invocations = 345
maximum_training_invocations = 360
training_invocation_retry_reserve = 15
maximum_gpu_hours = 500
maximum_cpu_hours = 5000
compute_limit_operator = "either"
maximum_memory_gib_per_job = 32
maximum_vram_gib_per_job = 12
maximum_storage_gib = 50
timeout_hours_4_clients = 2
timeout_hours_16_clients = 3
timeout_hours_64_clients = 6
campaign_days = 14
retry_limit = 1
retry_counts_toward_budget = true
second_timeout_oom_or_nonfinite = "cell_failed"
abort_at_first_compute_or_storage_limit = true
abort_when_failed_cell_fraction_exceeds = 0.05
retuning_after_start = false
incomplete_matrix_label = "incomplete"
incomplete_matrix_may_support_readme_evidence = false
