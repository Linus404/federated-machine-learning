[strategies.fedprox]
kind = "sample_weighted_mean_with_proximal_objective"
mu = 0.1
reference = "Immediately after loading round-start global model weights, create one immutable TensorFlow constant per model.trainable_weights entry in that order using keras.ops.convert_to_tensor(weight.numpy().copy()); create these before the first local optimizer step and reuse the same constants for every batch in that client's one local epoch."
data_loss = "Construct keras.losses.BinaryCrossentropy() with its Keras 3.14.0 defaults, which equal the registered from_logits, label_smoothing, axis, and sum_over_batch_size reduction. For each batch, evaluate it on the registered labels and attached-logit sigmoid output with no sample weights."
proximal_term = "In TensorFlow float32 and model.trainable_weights order, form one scalar term per variable with keras.ops.sum(keras.ops.square(local_weight-reference_weight)), then left-fold addition from the first term through the last and multiply by mu/2. Include every trainable scalar exactly once and no non-trainable variable."
local_objective = "data_loss + proximal_term; differentiate this scalar once with respect to model.trainable_variables and apply one Adam update per batch. The proximal term is one batch-level scalar and is not divided or multiplied by batch size."
client_update = "After the local epoch, each client submits its complete post-fit trainable and non-trainable model weights in model.weights order, plus its zero-based integer client_id in FitRes.metrics; it does not submit a delta."
aggregation_sample_weight = "The integer number of that client's fitted training rows supplied to the optimizer, excluding validation rows; retries do not change this weight."
aggregation = "Exactly strategies.fedavg aggregation_input, sample_weighting, executable, scaling_factors, reduction, result, and invalid_inputs. FedProx changes only the local objective; it does not change aggregation."

