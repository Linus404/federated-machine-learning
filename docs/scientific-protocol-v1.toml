sample_weights = [2, 1, 1]
initial_estimate = [7.5, 10.0]
estimate_after_10_updates = [4.335034175752573, 4.163210734443747]

[strategies.fedmedian]
kind = "coordinate_wise_median"
assumption = "Requires fewer than 50 percent Byzantine values at each coordinate."

[strategies.fedtrimmedavg]
kind = "coordinate_wise_trimmed_mean"
beta = 0.25
trim_count_rule = "floor(beta_times_client_count)_per_side"
assumption = "Robustness requires Byzantine values to occupy the trimmed extremes; no guarantee is claimed at 50 percent malicious clients."

[threats]
client_scale = 4
partition = "dirichlet_0.5"
malicious_fractions = [0.25, 0.5]
malicious_client_counts = [1, 2]
update_source = "malicious_client_model_delta"

[threats.outlier]
transformation = "submitted_delta_equals_10_times_honest_delta"
scale = 10.0

[threats.sign_flip]
transformation = "submitted_delta_equals_negative_10_times_honest_delta"
scale = -10.0

[privacy.membership_inference]
access = "black_box_prediction_probabilities"
knowledge = "candidate_records_and_membership_labels_for_the_balanced_attack_sample"
member_source = "fitted_training_rows_actually_supplied_to_the_model_optimizer"
nonmember_source = "official_test_split"
member_records = 1000
nonmember_records = 1000
records_per_class_per_membership = 500
sampling_replacement = false
sampling_algorithm = "For members and nonmembers separately and for labels 0 then 1, sort eligible official row indices, derive the pool-and-label-specific namespace at attempt 0, instantiate a new PCG64 Generator, permute once, discard the Generator, and take the first 500. Concatenate member label-0, member label-1, nonmember label-0, and nonmember label-1 records in that order; hard-fail if any pool-label has fewer than 500 eligible rows."
membership_positive_label = 1
membership_negative_label = 0
prediction_clip_minimum = 1e-7
prediction_clip_maximum = 0.9999999
per_example_loss = "Convert y and p to float64, set q=min(max(p,1e-7),0.9999999), and compute -(y*ln(q)+(1-y)*ln1p(-q)) with natural logarithms and no reduction."
attack_score = "negative_per_example_binary_crossentropy_loss_so_larger_means_more_likely_member"
success_metrics = ["roc_auc", "max_tpr_minus_fpr", "tpr_at_1_percent_fpr"]

[privacy.update_leakage]
attacker = "honest_but_curious_server"
access = ["individual_client_update", "current_global_model", "candidate_records"]
target_round_index = 0
selected_client = "lowest numeric zero-based client_id whose accepted fitted partition contains at least records_per_class_per_target_label rows of label 0 and at least that many rows of label 1; hard-fail the update-leakage cell if no client qualifies"
selected_client_feasibility = "The fixed count 500 is feasible for every registered master seed under dirichlet_0.5 with 4 clients; executable offline protocol tests derive the exact selected client for all five seeds."
pre_update_model = "global model sent to selected_client at the start of zero-based round index 0"
individual_client_update = "flatten in model trainable-variable order each selected_client post-fit weight minus the corresponding pre-update global weight"
member_source = "selected_client fitted training rows"
nonmember_source = "union of all non-selected clients fitted training rows from the same accepted partition"
member_records = 1000
nonmember_records = 1000
records_per_class_per_target_label = 500
sampling_replacement = false
sampling_algorithm = "For target members and target nonmembers separately and for labels 0 then 1, sort eligible official train row indices, derive the pool-and-label-specific namespace containing target_round_index and selected_client at attempt 0, instantiate a new PCG64 Generator, permute once, discard the Generator, and take the first 500. Concatenate member label-0, member label-1, nonmember label-0, and nonmember label-1 records in that order; hard-fail if no selected client exists or any pool-label has fewer than 500 eligible rows."
target_membership_positive_label = 1
target_membership_negative_label = 0
gradient_model = "pre_update_model"
gradient_loss = "Per-example binary_crossentropy in TensorFlow float32: set q=tf.clip_by_value(sigmoid_probability,1e-7,0.9999999) and compute -(y*tf.math.log(q)+(1-y)*tf.math.log1p(-q)) with no batch reduction; differentiate this exact expression, including the clip operation, with respect to trainable variables."
gradient_vector = "negative_gradient_of_loss_flattened_in_model_trainable_variable_order"
score = "dot(gradient_vector,individual_client_update)_divided_by_product_of_l2_norms"
zero_norm_score = 0.0
score_direction = "larger_means_more_likely_fitted_by_target_client"
success_metrics = ["roc_auc", "max_tpr_minus_fpr", "tpr_at_1_percent_fpr"]

[privacy.metrics]
input = "Finite float64 attack scores with binary membership labels, where label 1 is the positive class; hard-fail unless both classes are present."
thresholds = "Start with positive infinity, then each distinct finite score in strictly descending order. At threshold t, predict member exactly when score >= t; consume all equal-score records atomically, never order or split ties."
roc_points = "At every registered threshold, FPR=FP/number_of_negative_labels and TPR=TP/number_of_positive_labels in float64; retain repeated FPR points caused by positive-only threshold groups."
roc_auc = "numpy.trapezoid(tpr, fpr) over all threshold-ordered ROC points, including vertical repeated-FPR segments."
max_tpr_minus_fpr = "Maximum TPR-FPR over registered ROC points; if multiple thresholds attain it, select the first point, which is the highest threshold."
tpr_at_1_percent_fpr = "Set target FPR to 0.01. For each distinct FPR retain the maximum TPR at that FPR, then apply numpy.interp(target, ascending_distinct_fpr, retained_tpr); endpoints are therefore constant outside the observed FPR range. This interpolated value is a summary, not an attainable threshold claim."
target_fpr = 0.01

