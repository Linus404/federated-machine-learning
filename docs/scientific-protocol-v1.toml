sample_weighting = "None. Validate FitRes.num_examples through aggregation.sample_count_validation, then ignore every sample count during parameter aggregation. Every client contributes one value per coordinate."
executable = "Build (parameters_to_ndarrays(FitRes.parameters), FitRes.num_examples) pairs in ascending client_id order and call flwr.server.strategy.aggregate.aggregate_median from Flower 1.32.1 once. For each model.weights tensor position, Flower executes numpy.median(numpy.asarray(client_tensors), axis=0) with NumPy 2.4.4 defaults."
even_client_rule = "All registered client scales are even. For each coordinate, numpy.median selects the two central order statistics at zero-based positions client_scale/2-1 and client_scale/2 and passes those float32 values to its NumPy 2.4.4 axis-0 mean reduction; sample counts and client order do not select the middle values."
reduction = "The reduction tree is exactly the one executed by NumPy 2.4.4 numpy.median(numpy.asarray(client_tensors),axis=0), including its partition and even-middle float32 mean implementation. No cross-coordinate reduction and no client-ID-order sum occur; reproductions must call this exact function rather than substitute a sort or custom mean. Preserve the returned float32 tensor dtype, tensor order, and shapes without a cast."
invalid_inputs = "Exactly aggregation.common_invalid_inputs. Broadcasting, dtype promotion, masked values, NaN behavior, or unequal zip truncation are not accepted alternatives."
assumption = "Requires fewer than 50 percent Byzantine values at each coordinate."

