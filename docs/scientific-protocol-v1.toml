[strategies.fedprox_huber]
kind = "fedprox_with_iterative_huber_aggregation"
mu = 0.1
threshold = 10.0
iterations = 10
epsilon = 1e-8
local_objective = "Exactly strategies.fedprox, including its immutable round-start reference, float32 proximal sum reduction, batch-level placement, and Adam update."
client_vector = "Apply aggregation result-set, client, sample-count, model, and threat validation and ordering. Flatten each resulting complete submitted model in model.weights order with aggregation.coordinate_layout, stack vectors in ascending client_id order with numpy.stack, and call numpy.ndarray.astype(numpy.float32, copy=False). All registered input arrays are already float32; the call performs no information-losing cast."
sample_weight = "Convert each positive integer strategies.fedprox aggregation_sample_weight to float64, divide the vector of weights by its float64 sum once, and retain these normalized base weights for every iteration."
initialization = "Set estimate_0 = numpy.average(client_vectors, axis=0, weights=normalized_base_weights). Float32 client vectors and float64 weights produce a float64 estimate."
residual_norm = "At iteration t, residual_i = numpy.linalg.norm(estimate_t - client_vector_i) with no ord argument, the float64 Euclidean norm over the complete flattened vector."
epsilon_rule = "If residual_i <= threshold, set scale_i=1.0 without using epsilon; otherwise set scale_i=threshold/(residual_i+epsilon) exactly."
huber_weight = "Set effective_weight_i = sample_weight_i * scale_i."
update = "For t=0 through 9, normalize effective weights by their sum, then set estimate_(t+1) = numpy.average(client_vectors, axis=0, weights=normalized_effective_weights), preserving ascending client_id order in float64. Execute exactly 10 updates with no early stopping. Hard-fail on non-finite values or a non-positive effective-weight sum."
reconstruction = "After iteration 10, execute estimate_10.astype(numpy.float32) exactly once with default casting and no copy argument. Hard-fail if the cast result is non-finite. Split that float32 vector at the original model-weight element counts and reshape each part in C order to its reference model.weights shape without any further dtype cast; serialize those float32 arrays as the aggregated global parameters. This registered result cast is part of the Huber formula and is not input repair."

