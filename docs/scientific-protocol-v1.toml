use = "excluded"
raw_parquet_sha256 = "74d14fbfcbb39fb7d299c38ca9f0ae6d231bf97108da85d620027ba437b6d52e"
content_sha256 = "d56c24962d82526173fc9fab14b820873ea281d64ab11915ec12eaf73f65deeb"

[untouched_test]
split = "test"
sole_global_test_set = true
available_to_client_training = false
available_to_validation = false
available_to_tuning = false
available_to_model_selection = false
available_to_partitioning = false
access = "registered_final_model_evaluation_and_registered_privacy_analysis_only"
decision_threshold = 0.5
threshold_comparison = "probability_greater_than_or_equal"
selection_rule = "Never tune thresholds, hyperparameters, strategies, stopping, or model selection on test results."
train_split_use = "Only the official train split may supply training and deterministic stratified validation rows."

[seeding]
seeds = [67, 101, 211, 307, 401]
application = ["partitioning", "validation_split", "model_initialization", "training_order", "dropout", "threat_construction", "privacy_sampling"]
hash_algorithm = "sha256"
seed_material = "master_seed_pipe_namespace_pipe_attempt_encoded_as_ascii"
uint64_byte_slice = "first_8_digest_bytes"
uint64_byte_order = "big"
python_derivation = '''int.from_bytes(hashlib.sha256(f"{master_seed}|{namespace}|{attempt}".encode("ascii")).digest()[:8], "big", signed=False)'''
numpy_generator = "numpy.random.Generator(numpy.random.PCG64(derived_uint64))"
tensorflow_seed = "derived_uint64_modulo_2147483647_with_zero_replaced_by_one"
tensorflow_seed_python = '''seed = derived_uint64 % 2147483647 or 1'''
default_attempt = 0
namespace_is_utf8_ascii = true
namespace_reuse_forbidden = true
generator_lifecycle = "Derive one uint64 for one fully expanded namespace and attempt, instantiate exactly one numpy.random.Generator with PCG64 from it, execute only that namespace's registered stochastic operation, then discard the generator. Never share or reuse a Generator across namespaces, labels, clients, rounds, epochs, attempts, cells, or master seeds."
label_namespace_rule = "Every stochastic operation performed separately by label has a distinct namespace ending in label-{label}; derive and instantiate its Generator independently."

[seeding.cell_id]
fields = ["matrix_kind", "strategy", "partition", "alpha", "client_scale", "seed", "threat"]
serialization = "compact_sorted_json"
serialization_is_identifier = true
python_serialization = '''json.dumps({"matrix_kind": matrix_kind, "strategy": strategy, "partition": partition, "alpha": alpha, "client_scale": client_scale, "seed": seed, "threat": threat}, ensure_ascii=True, sort_keys=True, separators=(",", ":"), allow_nan=False)'''
matrix_kind = "Exact subsection name under matrix: primary_federated, centralized, local_only, scale, robustness, membership_inference, or update_leakage."
strategy = "Registered training strategy; for privacy analysis cells this is the source model name from the matrix models list."
partition = "Registered partition name, or JSON null for centralized cells and centralized membership-inference cells."
alpha = "Dirichlet alpha as a JSON number for dirichlet partitions, or JSON null for iid_stratified and non-partitioned cells."
client_scale = "Registered integer client scale, or JSON null for centralized cells and centralized membership-inference cells."
seed = "Registered integer master seed, not its ordinal position."
threat = '''JSON null outside robustness. For robustness, exactly {"attack": <registered attack string>, "malicious_fraction": <registered JSON number>}; no other threat keys are permitted.'''
canonical_example = '''{"alpha":0.5,"client_scale":4,"matrix_kind":"robustness","partition":"dirichlet_0.5","seed":67,"strategy":"fedavg","threat":{"attack":"outlier","malicious_fraction":0.25}}'''

[seeding.namespaces]
partition_iid = "partition/iid/{client_scale}/round--1/epoch--1/client--1/label-{label}"
partition_dirichlet = "partition/{partition_name}/{client_scale}/round--1/epoch--1/client--1/label-{label}"
validation = "validation/{partition_name}/{client_scale}/round--1/epoch--1/client-{client_id}/label-{label}"
model_initialization = "model/{cell_id}/round--1/epoch--1/client-{client_id}"
training_order = "training/{cell_id}/round-{round_index}/epoch-{epoch_index}/client-{client_id}"
dropout = "dropout/{cell_id}/round-{round_index}/epoch--1/client-{client_id}"
malicious_order = "malicious-order/dirichlet_0.5/4/round--1/epoch--1/client--1"
membership_member = "privacy/membership/{cell_id}/member/round--1/epoch--1/client--1/label-{label}"
membership_nonmember = "privacy/membership/{cell_id}/nonmember/round--1/epoch--1/client--1/label-{label}"
update_member = "privacy/update-leakage/{cell_id}/member/round-{round_index}/epoch--1/client-{client_id}/label-{label}"
update_nonmember = "privacy/update-leakage/{cell_id}/nonmember/round-{round_index}/epoch--1/client-{client_id}/label-{label}"

[indexing]
all_indices_zero_based = true
non_applicable_seed_namespace_index = -1
federated_round_indices = "integers from 0 through 19"
federated_epoch_indices_per_round = [0]
centralized_epoch_indices = "integers from 0 through 19"
local_only_epoch_indices = "integers from 0 through 19"
client_indices = "integers from 0 through client_scale minus 1"
label_indices = [0, 1]
seed_namespace_rule = "Every seed namespace that contains round, epoch, or client dimensions uses the zero-based index when applicable and the literal sentinel -1 when not applicable; the rendered sentinel therefore appears as round--1, epoch--1, or client--1."

[indexing.namespace_contexts]
federated_training = { round_index = "0_through_19", epoch_index = 0, client_id = "0_through_client_scale_minus_1" }
centralized_training = { round_index = -1, epoch_index = "0_through_19", client_id = -1 }
local_only_training = { round_index = -1, epoch_index = "0_through_19", client_id = "0_through_3" }
global_model_initialization = { round_index = -1, epoch_index = -1, client_id = -1 }
local_only_model_initialization = { round_index = -1, epoch_index = -1, client_id = "0_through_3" }

[partitioning]
registered = ["iid_stratified", "dirichlet_1.0", "dirichlet_0.5", "dirichlet_0.1"]
dirichlet_alphas = [1.0, 0.5, 0.1]
minimum_samples_per_client = 32
first_attempt = 0
last_attempt = 9999
attempt_seed_rule = "derive_deterministically_from_experiment_seed_and_attempt"
acceptance_rule = "Accept the first attempt in ascending order where every client has at least 32 samples; fail after attempt 9999."
client_scales = [4, 16, 64]
primary_client_scale = 4
row_identity = "zero_based_official_split_row_index"
labels = [0, 1]
client_id_format = "client-{zero_based_integer}"

[partitioning.iid]
algorithm = "For each label in ascending order, sort row indices, derive its label-specific namespace at attempt 0, instantiate a new PCG64 Generator, permute the rows once, discard the Generator, split with numpy.array_split into client_scale parts in ascending client ID order, concatenate both label parts per client, then sort each client shard by row index."
attempt = 0
balance = "per_label_part_sizes_differ_by_at_most_one"

[partitioning.dirichlet]
algorithm = "For each attempt and each label in ascending order, sort its row indices, derive that label's partition namespace with the current attempt, instantiate a new PCG64 Generator, call generator.permutation, generator.dirichlet with client_scale copies of alpha, and generator.multinomial with the label row count and those probabilities, then discard the Generator and assign consecutive permuted rows to clients in ascending ID order using those counts. Concatenate both label allocations per client and sort each shard by row index."
retry_scope = "discard_every_client_allocation_and_restart_with_next_attempt"
acceptance_checked_after_both_labels = true

[partitioning.validation]
algorithm = "Within each accepted client shard and each label in ascending order, sort row indices, derive the client-and-label-specific validation namespace at attempt 0, instantiate a new PCG64 Generator, permute once, discard the Generator, assign the first floor(label_count_times_0.2) rows to validation and all remaining rows to fitted training, then sort both resulting index sets."
validation_union_use = "server_held_per_round_global_validation_only"
fitted_rows_use = "optimizer_input_only"

[selection.clients]
fit_participation = "all_registered_clients_every_round"
evaluation_participation = "none"
evaluation_execution = "After each aggregation, the server evaluates the global model exactly once on the ascending-row-index union of all registered validation rows; clients receive no evaluate request and return no evaluate response."
order = "ascending_numeric_client_id"
random_sampling = false

[selection.malicious]
algorithm = "At attempt 0, instantiate one PCG64 Generator for the malicious-order namespace, permute ascending client IDs once, discard the Generator, and for malicious count k choose the first k IDs and sort the chosen IDs for execution."
pairing = "Reuse the same seeded permutation across all robustness strategies, attacks, and malicious fractions for one master seed; the one-client set is a subset of the two-client set."

[model]
revision = "sentiment-cnn-v1"
vocabulary_size = 20000
sequence_length = 500
embedding_dimension = 100
embedding_trainable = true
padding_token_id = 0
padding_masked_before_convolution = true
convolution_filters = 64
convolution_kernel_size = 3
convolution_padding = "same"
convolution_activation = "relu"
convolution_use_bias = false
pooling = "global_max_1d"
hidden_units = 32
hidden_activation = "relu"
dropout_rate = 0.3
output_units = 1
output_activation = "sigmoid"
loss = "keras.losses.BinaryCrossentropy"
loss_from_logits = false
loss_label_smoothing = 0.0
loss_axis = -1
loss_reduction = "sum_over_batch_size"
loss_probability_clip = 1e-7
loss_logit_recovery_required = true
loss_definition = "The registered sigmoid output tensor must be passed directly to keras.losses.BinaryCrossentropy. In Keras 3.14.0 with the TensorFlow 2.20.0 backend, the Sigmoid layer attaches its pre-activation float32 logits; BinaryCrossentropy(from_logits=False) recovers those logits and evaluates tf.nn.sigmoid_cross_entropy_with_logits, averages the one-element output axis, then sum_over_batch_size averages examples in the batch. Never detach, copy, cast, serialize, or reconstruct probabilities before training loss evaluation because doing so loses the attached logits and changes saturated-edge loss semantics."
loss_probability_fallback = "loss_probability_clip=1e-7 documents Keras's fallback only when no attached logits exist; that fallback is not the registered model-training path."

