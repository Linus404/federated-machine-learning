[strategies.fedtrimmedavg]
kind = "coordinate_wise_trimmed_mean"
beta = 0.25
aggregation_input = "Exactly aggregation.submitted_value and aggregation.coordinate_layout."
sample_weighting = "None. Validate FitRes.num_examples through aggregation.sample_count_validation, then ignore every sample count during parameter aggregation. Every retained client value contributes equally per coordinate."
executable = "Build (parameters_to_ndarrays(FitRes.parameters), FitRes.num_examples) pairs in ascending client_id order and call flwr.server.strategy.aggregate.aggregate_trimmed_avg from Flower 1.32.1 once with proportiontocut=0.25. For each model.weights tensor position, Flower stacks client tensors with numpy.asarray, then its _trim_mean executes numpy.partition(array, (lowercut, uppercut-1), axis=0), slices partitioned[lowercut:uppercut] on axis 0, and executes numpy.mean(slice, axis=0), all with NumPy 2.4.4 defaults."
trim_count_rule = "For client_count n, compute lowercut=int(0.25*n) and uppercut=n-lowercut; because n is a positive registered integer, lowercut=floor(0.25*n). Remove exactly lowercut lowest and lowercut highest order statistics independently at every coordinate. Registered counts 4, 16, and 64 therefore trim 1, 4, and 16 values per side and retain 2, 8, and 32 values."
reduction = "For every coordinate, the reduction tree is exactly the one executed by NumPy 2.4.4 numpy.mean(partitioned[lowercut:uppercut],axis=0), using NumPy's float32 sum accumulator and division over the axis-0 slice returned by numpy.partition. Reproductions must call these exact functions; do not sort the retained values, substitute a client-ID-order left fold, use float64 accumulation, or average client deltas. Preserve the returned float32 tensor dtype, tensor order, and shapes without a cast."
invalid_inputs = "Exactly aggregation.common_invalid_inputs, plus hard-fail unless 0.0 <= beta < 0.5 and client_count-2*floor(beta*client_count) is positive. Broadcasting, dtype promotion, masked values, NaN behavior, or unequal zip truncation are not accepted alternatives."
assumption = "Robustness requires Byzantine values to occupy the trimmed extremes; no guarantee is claimed at 50 percent malicious clients."

