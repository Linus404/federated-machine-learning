worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format audit_json escape=json
        '{"timestamp":"$time_iso8601","remote":"$remote_addr","user":"$remote_user",'
        '"request":"$request","status":$status,"bytes":$body_bytes_sent,'
        '"request_time":$request_time,"agent":"$http_user_agent"}';
    access_log /dev/stdout audit_json;
    error_log /dev/stderr warn;

    server {
        listen 8080;
        server_tokens off;

        location = /healthz {
            auth_basic off;
            access_log off;
            return 200 "ok\n";
        }

        location / {
            auth_basic "Federated ML dashboard";
            auth_basic_user_file /run/secrets/dashboard_htpasswd;
            proxy_pass http://dashboard:8501;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }
    }
}
