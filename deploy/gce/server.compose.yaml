x-flower-service: &flower-service
  image: federated-machine-learning:latest
  restart: unless-stopped

services:
  superlink:
    <<: *flower-service
    build:
      context: ../../
    # First-pass insecure deployment:
    # TLS certificates and SuperNode authentication are intentionally out of scope.
    command: >
      uv run --no-sync
      flower-superlink
      --insecure
      --isolation process
      --database /app/state/state.db
      --health-server-address 0.0.0.0:9099
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(("127.0.0.1", 9099), timeout=2).close()
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    ports:
      - "9092:9092"
      - "127.0.0.1:9093:9093"
    volumes:
      - superlink-state:/app/state

  serverapp:
    <<: *flower-service
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type serverapp
      --appio-api-address superlink:9091
    environment:
      FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public
      FML_SERVER_ARTIFACT_DIR: /app/artifacts/server
    depends_on:
      superlink:
        condition: service_healthy
    volumes:
      - ../../artifacts/public:/app/artifacts/public:ro
      - ../../artifacts/server:/app/artifacts/server

  dashboard:
    <<: *flower-service
    command: >
      uv run --no-sync
      streamlit run dashboard.py
      --server.address=0.0.0.0
      --server.port=8501
      --server.enableCORS=false
      --server.enableXsrfProtection=false
    environment:
      FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public
      FML_SERVER_ARTIFACT_DIR: /app/artifacts/server
    volumes:
      - ../../artifacts/public:/app/artifacts/public:ro
      - ../../artifacts/server:/app/artifacts/server:ro
    ports:
      - "127.0.0.1:8501:8501"

volumes:
  superlink-state:
