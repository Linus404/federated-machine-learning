x-flower-service: &flower-service
  image: federated-machine-learning:latest
  restart: unless-stopped

x-supernode: &supernode
  <<: *flower-service
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - >-
        import socket;
        socket.create_connection(("127.0.0.1", 9094), timeout=2).close()
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  supernode:
    <<: *supernode
    build:
      context: ../../
    command: >
      uv run --no-sync
      flower-supernode
      --insecure
      --superlink ${SUPERLINK_ADDRESS:?set SUPERLINK_ADDRESS}
      --node-config partition-id=${CLIENT_ID:?set CLIENT_ID}
      --clientappio-api-address 0.0.0.0:9094
      --isolation process

  clientapp:
    <<: *flower-service
    depends_on:
      supernode:
        condition: service_healthy
    command: >
      uv run --no-sync
      flower-superexec
      --insecure
      --plugin-type clientapp
      --appio-api-address supernode:9094
    environment:
      CLIENT_DATA_DIR: /app/client-data
      FML_PUBLIC_ARTIFACT_DIR: /app/artifacts/public
    volumes:
      - ../../artifacts/public:/app/artifacts/public:ro
      - type: bind
        source: ${CLIENT_SHARD_DIR:?set CLIENT_SHARD_DIR}
        target: /app/client-data
        read_only: true
